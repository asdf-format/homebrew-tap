name: Check bottles

# Homebrew/core can change a dependency without any change to this tap,
# breaking bottles that have already been published.
#
# This workflow checks for this periodically and ensures that our bottles
# are still installable against those Homebrew/core dependencies.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check-bottles:
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-26 ]
        include:
          - os: ubuntu-latest
            container: ghcr.io/homebrew/brew:main
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for conflicting versioned dependencies
        run: |
          brew ruby -e '
            conflicts = Tap.fetch("asdf-format/tap").formula_names.filter_map do |name|
              formula = Formula[name]
              versioned = formula.runtime_formula_dependencies(read_from_tab: false)
                                 .map(&:name)
                                 .group_by { |dep| dep.split("@").first }
                                 .select { |_, deps| deps.size > 1 }
              next if versioned.empty?

              "::error::#{formula.full_name} depends on #{versioned.values.flatten.join(" and ")}"
            end
            puts conflicts
            exit 1 if conflicts.any?
          '

      - name: Install bottles and check linkage
        if: ${{ !cancelled() }}
        run: |
          failed=()
          for formula in $(brew ruby -e 'Tap.fetch("asdf-format/tap").formula_names.each { |name| puts Formula[name].full_name if Formula[name].bottled? }'); do
            echo "::group::${formula}"
            if brew install --include-test "${formula}" &&
               brew linkage --test "${formula}" &&
               brew test "${formula}"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::${formula} bottle is broken against current dependencies"
              failed+=("${formula}")
            fi
          done
          [[ ${#failed[@]} -eq 0 ]]
